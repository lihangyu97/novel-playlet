name: novel_playlet
description: "小说阅读 App：iOS，小说-only，复用 Rust 内核的加解密与接口。"
publish_to: 'none'
version: 0.6.0+14

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # 中文 Material 文案（复制/粘贴/全选）。
  flutter_localizations:
    sdk: flutter
  # 后端桥：与 rust/Cargo.toml 的 flutter_rust_bridge 版本必须完全一致。
  flutter_rust_bridge: 2.13.0
  # 状态管理：每个功能域一个 Notifier，页面只读 provider。
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.0
  # 设备池密钥（Keychain）。密钥材料不落任何明文存储。
  flutter_secure_storage: ^9.0.0
  # 书架/阅读进度等轻量本地状态。
  shared_preferences: ^2.3.0
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.8
  # 推荐流瀑布流（双列/三列、卡片不定高）：社区标准实现，自己手写 RenderSliver
  # 的测量/回收/滚动缓存成本太高。依赖白名单见 CONTRACTS.md「硬性规则」。
  # 钉预发布版：0.7.x 的 SDK 上界是 <3.0.0，Dart 3 直接解析失败；0.8.0-dev.3
  # 才把约束放到 >=3.2.0 <4.0.0，API 与 0.7.x 一致（SliverMasonryGrid.count）。
  flutter_staggered_grid_view: 0.8.0-dev.3
  # 正文 HTML → 段落。
  html: 0.15.6
  cupertino_icons: ^1.0.8
  # 视频播放：底层 AVPlayer（iOS）。方案与边界见 docs/implementation.md。
  video_player: ^2.14.1

# AVPlayer 起播/seek 后会把 rate 复位成 defaultRate；上游 2.12.3 没有同步
# defaultRate，导致 UI 显示 2x、实际播放 1x。这里用本地打过补丁的插件实现
# （改动与升级流程见 third_party/README.md）。
dependency_overrides:
  video_player_avfoundation:
    path: third_party/video_player_avfoundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 真机性能采集（integration_test/reader_pagination_perf_test.dart）。
  # 只在 `flutter drive --profile -d <device>` 时用，不进 flutter test。
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
