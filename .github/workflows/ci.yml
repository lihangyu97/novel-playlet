# 最小质量门禁：format / analyze / test / clippy / 绑定漂移 / iOS 无签名构建。
#
# 设计取舍：
# - Flutter 跑在 macOS：test/ui/ 的 golden 会加载系统里的 Arial Unicode 做中文
#   预览字体（见 test/ui/preview_harness.dart 的 loadPreviewFont），Linux 上
#   没有这个字体，goldens 必然全红。
# - Rust 跑在 Linux：内核测试全部用 mock upstream + 临时目录，不依赖 macOS。
# - iOS 构建单独一个 macOS job：只验证「内核静态库 + Xcode 无签名构建」能过，
#   不签名、不安装，避免占用证书/设备。
# - 两端工具链都按本机验证过的版本钉死（Flutter 3.47.9 / Rust 1.99.1），
#   避免 rustfmt / clippy / Skia 版本漂移把 CI 变成随机红灯。
name: CI

# 自动触发暂时关闭（2026-11-06）：App 还在快速迭代，连续提 PR 时 CI 影响效率。
# 等 App 稳定后把触发器加回来即可（job 内容不用动）：
#   on:
#     push:
#       branches: [main]
#     pull_request:
# 手动跑一次：仓库 Actions 页面 → CI → Run workflow，或 `gh workflow run ci.yml`。
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: flutter (format / analyze / test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      # 格式先于分析：Dart 的 tall-style 由 SDK 决定，不设门禁会慢慢漂。
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --fatal-infos
      - run: flutter test

  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml

  codegen:
    name: FRB 绑定漂移校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # codegen 依赖 cargo-expand 解析宏；用预编译装，别在 CI 里编译一遍。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      # 版本必须与 rust/Cargo.toml 的 flutter_rust_bridge 完全一致（2.13.0）。
      - run: cargo install flutter_rust_bridge_codegen --version 2.13.0
      - run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
      - name: 生成物必须与入库版本一致
        run: git diff --exit-code

  ios:
    name: ios (无签名构建)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - run: flutter pub get
      # build_rust_ios.sh 内部先跑 FRB codegen（缺工具会硬错），再编 device 静态库。
      - run: cargo install flutter_rust_bridge_codegen --version 2.13.0
      - run: ./scripts/build_rust_ios.sh
      - run: pod install
        working-directory: ios
      - run: flutter build ios --release --no-codesign
